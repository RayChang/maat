name: Claude Auto Review and Merge

# Reviews every PR automatically. A PR into develop is merged when either
# the Claude review step of the same run approves the current head commit, the Linux CI job passes on that commit, and the PR does not touch .github/;
# or the repository owner comments "/merge <head commit sha>" (7-40 hex chars).
# Other bases are never merged.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request'
    concurrency:
      group: claude-auto-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh pr merge in the merge step
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The runner, its lockfile and the review rules come from the base branch; nothing from the PR runs with secrets.
      - name: Prepare Claude review runner (base branch copy)
        id: prep
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          if git archive "origin/$BASE_REF" .github/claude-review | tar -x -C "$RUNNER_TEMP"; then
            npm ci --prefix "$RUNNER_TEMP/.github/claude-review" --ignore-scripts --no-audit --no-fund
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report missing review runner
        if: steps.prep.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body "審查未執行：base 分支沒有 .github/claude-review。"

      - name: Run Claude review (Agent SDK)
        id: review
        if: steps.prep.outputs.ready == 'true'
        env:
          MODE: review
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REVIEW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          SYSTEM_PROMPT_FILE: ${{ runner.temp }}/.github/claude-review/system-prompt.md
        run: node "$RUNNER_TEMP/.github/claude-review/run.mjs"

      # Trusts only the verdict the review step above wrote to its own output, never PR comments.
      - name: Merge when this run's review approved this head commit
        if: steps.review.outputs.result == 'APPROVED'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$base" != "develop" ] || [ "$head" != "$SHA" ]; then
            echo "Not merging: base=$base head=$head reviewed=$SHA"; exit 0
          fi
          if gh pr diff "$PR" --name-only | grep -q '^\.github/'; then
            echo "Not merging: this PR changes .github/; the owner must comment /merge"; exit 0
          fi
          # Wait up to 20 minutes for the Linux CI job of this exact commit; merge only on success.
          # The macOS job still runs but does not gate merging (macOS runners are often unavailable).
          ci=""
          for i in $(seq 1 40); do
            run=$(gh run list --workflow ci.yml --commit "$SHA" --event pull_request --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty' || true)
            if [ -n "$run" ]; then
              ci=$(gh run view "$run" --json jobs \
                --jq '.jobs[] | select(.name == "test (ubuntu-latest)") | "\(.status) \(.conclusion)"' || true)
            fi
            case "$ci" in completed*) break;; esac
            sleep 30
          done
          if [ "$ci" != "completed success" ]; then
            echo "Not merging: Linux CI for $SHA is '${ci:-missing}'"; exit 0
          fi
          gh pr merge "$PR" --merge --delete-branch --match-head-commit "$SHA"

  owner-merge:
    if: |
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/merge ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge on owner "/merge <sha>" command
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          cmd=$(printf '%s' "$COMMENT" | tr -d '\r' | sed 's/[[:space:]]*$//')
          if ! printf '%s' "$cmd" | grep -Eqx '/merge [0-9a-f]{7,40}'; then
            echo "Not merging: expected '/merge <commit sha>'"; exit 0
          fi
          want=${cmd#/merge }
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          if [ "$base" != "develop" ]; then
            echo "Not merging: base=$base"; exit 0
          fi
          case "$head" in
            "$want"*) gh pr merge "$PR" --merge --delete-branch --match-head-commit "$head" ;;
            *) echo "Not merging: PR head is $head, not $want" ;;
          esac
