name: Claude PR Assistant

# Answers @claude mentions on pull requests through the Agent SDK (.github/claude-review/run.mjs).
# Read-only: Claude can read the PR and reply with one comment; it cannot change files.
# Review rules live in .github/claude-review/system-prompt.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-mention:
    # Only PR comments that mention @claude, from people with write access to this repository
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Copy the runner and rules from the checked-out default branch before switching to the PR branch.
      - name: Prepare Claude runner
        run: |
          cp -R .github/claude-review "$RUNNER_TEMP/claude-review"
          npm ci --prefix "$RUNNER_TEMP/claude-review" --ignore-scripts --no-audit --no-fund
          gh pr checkout "$PR"

      - name: Run Claude (Agent SDK)
        env:
          MODE: mention
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
          SYSTEM_PROMPT_FILE: ${{ runner.temp }}/claude-review/system-prompt.md
        run: node "$RUNNER_TEMP/claude-review/run.mjs"
