name: Claude PR Assistant

# Answers @claude mentions on pull requests through the Agent SDK (.github/claude-review/run.mjs).
# Read-only: Claude can read the PR and reply with one comment; it cannot change files.
# Review rules live in .github/claude-review/system-prompt.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-mention:
    # Only PR comments that mention @claude, from people with write access to this repository
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: false

      # The runner, its lockfile and the rules come from the default branch; nothing from the PR runs with secrets.
      - name: Prepare Claude runner (default branch copy)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -o pipefail
          git archive "origin/$DEFAULT_BRANCH" .github/claude-review | tar -x -C "$RUNNER_TEMP"
          npm ci --prefix "$RUNNER_TEMP/.github/claude-review" --ignore-scripts --no-audit --no-fund

      - name: Run Claude (Agent SDK)
        env:
          MODE: mention
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
          SYSTEM_PROMPT_FILE: ${{ runner.temp }}/.github/claude-review/system-prompt.md
        run: node "$RUNNER_TEMP/.github/claude-review/run.mjs"
