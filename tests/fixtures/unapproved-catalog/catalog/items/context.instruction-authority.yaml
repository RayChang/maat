    "logic": "authority 對所有選定 CLI 成立，且沒有未解決的候選衝突",
    "expected": "權威來源與優先順序有範圍依據；已知候選衝突已處理，不宣稱任何地方都沒有衝突",
    "agent_review": "重新列出候選衝突，只當候選",
