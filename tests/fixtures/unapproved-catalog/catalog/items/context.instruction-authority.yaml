        "catalog 與 adapter 版本",
        "確認者",
        "有效期限"
      ],
      "invalidated_by": "依據的檔案改變、catalog 或 adapter 改版、到期"
    },
    "conflicts": "機器觀察到的相反事實不會被確認覆寫；兩者並列並保持待確認"
  },
