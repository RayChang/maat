{
  "id": "repo-discovery",
  "version": 1,
  "contracts": [
    {
      "check": "foundation.verify-entrypoints",
      "item_version": 1,
      "actions": [
        "先詢問權威的驗證進入點；不得猜測",
        "計畫文字：在核心指引加一行，記錄驗證指令與回報方式"
      ],
      "targets": "依選定 CLI 的 adapter；位置未知時列為問題",
      "risk": "low",
      "needs_approval": false,
      "verification": {
        "rerun": [
          "manifest.verify-entrypoint@1",
          "instructions.verify-entrypoint@1",
          "policy.verify-entrypoint@1"
        ],
        "logic": "declared 與 documented 都要成立",
        "expected": "兩個能力判定成立",
        "attestation": {
          "question": "哪個指令是權威的驗證進入點？記錄在哪裡？",
          "requires": [
            "範圍",
            "證據指紋",
            "catalog 與 adapter 版本",
            "確認者",
            "有效期限"
          ]
        },
        "conflicts": "使用者確認與機器觀察矛盾時，兩者並列，保持待確認"
      },
      "derived_from": [
        {
          "type": "tool_policy",
          "ref": "spec 5.1 工程基礎「驗證指令」",
          "use": "保留題目"
        },
        {
          "type": "tool_policy",
          "ref": "工具研究 4.3 commands.verify-documented",
          "use": "政策改寫（拆成兩個能力）"
        },
        {
          "type": "practitioner",
          "ref": "gist 83e12fa › Workflow Orchestration › 5. Verification Before \"Done\"（第 94 行）",
          "use": "規則卡沿用"
        },
        {
          "type": "practitioner",
          "ref": "gist 83e12fa › Repository Discovery Playbook 第 5 步（第 548 行）",
          "use": "規則卡沿用"
        },
        {
          "type": "practitioner",
          "ref": "Factory Agent Readiness：Style & Validation、Testing（工具研究第 3 節）",
          "use": "政策改寫"
        }
      ]
    },
    {
      "check": "context.index-to-details",
      "item_version": 1,
      "actions": [
        "在既有入口加入少量主題到細節的連結",
        "修復失效路徑，保留有用途的概覽，不複製整份細節"
      ],
      "targets": "現有指引或 README",
      "risk": "low",
      "needs_approval": false,
      "verification": {
        "rerun": [
          "documents.local-links@1"
        ],
        "logic": "all；逐指定主題核對可定位來源與有效性",
        "expected": "路徑可解析或有有效外部材料，不以檔案數量衡量完整性",
        "attestation": {
          "question": "請示範從入口找到各必要主題的來源，確認內容仍適用於目前版本",
          "requires": [
            "範圍",
            "證據指紋",
            "catalog 與 adapter 版本",
            "確認者",
            "有效期限"
          ]
        }
      },
      "derived_from": [
        {
          "type": "original_item",
          "ref": "檢視 3.3 C1",
          "use": "保留題目並限定適用性"
        },
        {
          "type": "practitioner",
          "ref": "gist 83e12fa:L548–565 Repository Discovery Playbook",
          "use": "規則卡沿用"
        }
      ]
    },
    {
      "check": "context.code-navigation",
      "item_version": 1,
      "actions": [
        "先用既有搜尋與局部閱讀建立導航例子",
        "只有無法滿足目標時才提出索引或其他工具選項"
      ],
      "targets": "工作流程說明與現有查詢工具；新增工具另行決定",
      "risk": "low",
      "needs_approval": false,
      "verification": {
        "rerun": [],
        "logic": "all；核對指定查詢及樣本結果與目前符號位置",
        "expected": "結果有精確定位、範圍與版本，保留未涵蓋部分",
        "attestation": {
          "question": "請提供查找一個定義與其使用處／測試的紀錄；說明 agent 能使用的方式與限制",
          "requires": [
            "範圍",
            "證據指紋",
            "catalog 與 adapter 版本",
            "確認者",
            "有效期限"
          ]
        }
      },
      "derived_from": [
        {
          "type": "original_item",
          "ref": "檢視 3.3 C4",
          "use": "保留題目"
        },
        {
          "type": "practitioner",
          "ref": "gist 83e12fa:L237–247 Read Before Write；L548–565 Discovery",
          "use": "導航規則卡沿用"
        }
      ]
    }
  ]
}
